name: Build and validate Codex Pet

on:
  push:
    paths:
      - "codex-pet/**"
      - ".github/workflows/validate-codex-pet.yml"
  pull_request:
    paths:
      - "codex-pet/**"
      - ".github/workflows/validate-codex-pet.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  atlas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check -r codex-pet/requirements.txt
      - run: python codex-pet/generate_spritesheet.py
      - run: python codex-pet/verify.py
      - name: Commit generated atlas
        if: github.event_name == 'push'
        shell: bash
        run: |
          if git diff --quiet -- codex-pet/spritesheet.png; then
            echo "Atlas already matches the generator."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add codex-pet/spritesheet.png
          git commit -m "Generate BLACK Sentinel sprite atlas"
          git push
      - name: Require committed atlas in pull requests
        if: github.event_name == 'pull_request'
        run: git diff --exit-code -- codex-pet/spritesheet.png
