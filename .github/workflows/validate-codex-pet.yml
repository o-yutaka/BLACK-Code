name: Build and validate Codex Pet

on:
  push:
    paths:
      - "codex-pet/**"
      - ".github/workflows/validate-codex-pet.yml"
  pull_request:
    paths:
      - "codex-pet/**"
      - ".github/workflows/validate-codex-pet.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  atlas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check -r codex-pet/requirements.txt
      - run: python codex-pet/generate_spritesheet.py
      - run: python codex-pet/verify.py
      - name: Commit generated atlas
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          TARGET_BRANCH: ${{ github.head_ref || github.ref_name }}
        shell: bash
        run: |
          git add -f codex-pet/spritesheet.png
          if git diff --cached --quiet; then
            echo "Atlas already matches the generator."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Generate BLACK Sentinel sprite atlas"
          git push origin "HEAD:${TARGET_BRANCH}"
      - name: Require committed atlas for external pull requests
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        run: |
          git ls-files --error-unmatch codex-pet/spritesheet.png
          git diff --exit-code -- codex-pet/spritesheet.png
