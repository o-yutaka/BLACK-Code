name: validate-model-pipeline-7.27

on:
  pull_request:
    paths:
      - 'local-runtime/**'
      - '.github/workflows/validate-model-pipeline-7.27.yml'
  push:
    branches: [main]
    paths:
      - 'local-runtime/**'
      - '.github/workflows/validate-model-pipeline-7.27.yml'

jobs:
  pipeline-contract:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse governed pipeline scripts
        shell: powershell
        run: |
          foreach ($file in @(
            './local-runtime/setup-resumable-7.27.ps1',
            './local-runtime/run-model-pipeline-7.27.ps1',
            './local-runtime/verify-model-pipeline-7.27.ps1'
          )) {
            $tokens = $null
            $errors = $null
            [void][Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$tokens, [ref]$errors)
            if (@($errors).Count -gt 0) { throw "PowerShell parse failed: $file :: $($errors[0].Message)" }
          }
      - name: Verified parent handoff forces Hub offline during setup
        shell: powershell
        run: |
          $fixture = Join-Path $env:RUNNER_TEMP 'black-offline-parent-handoff'
          Copy-Item -Recurse -Force ./local-runtime $fixture
          $work = Join-Path $env:RUNNER_TEMP 'black-offline-parent-work'
          New-Item -ItemType Directory -Force -Path $work | Out-Null
          @'
          param([string]$WorkDir,[int]$StallSeconds=900,[int]$MaxStallRestarts=4,[int]$RetryBackoffSeconds=10)
          New-Item -ItemType Directory -Force -Path $WorkDir | Out-Null
          $lock = Get-Content -Raw -LiteralPath (Join-Path $PSScriptRoot 'model-7.27.lock.json') | ConvertFrom-Json
          [ordered]@{
            schema_version='1.1'; status='VERIFIED_COMPLETE'; snapshot_complete=$true;
            repo=[string]$lock.uncensored_parent.repo; revision=[string]$lock.uncensored_parent.revision;
            work_dir=$WorkDir
          } | ConvertTo-Json | Set-Content -Encoding UTF8 -LiteralPath (Join-Path $WorkDir 'parent-download-state.json')
          '@ | Set-Content -Encoding UTF8 -LiteralPath (Join-Path $fixture 'prepare-parent-7.27.ps1')
          @'
          param([switch]$Force,[switch]$ForceLlama,[string]$ModelWorkDir,[switch]$PurgeModelDownloadCache,[int]$HfDownloadWorkers=8)
          if ($env:HF_HUB_OFFLINE -ne '1') { throw 'HF_HUB_OFFLINE was not set for verified-parent downstream setup' }
          if ($env:BLACK_CODE_PARENT_PREPARED -ne '1') { throw 'BLACK_CODE_PARENT_PREPARED was not set' }
          exit 0
          '@ | Set-Content -Encoding UTF8 -LiteralPath (Join-Path $fixture 'setup.ps1')
          $beforeOffline = $env:HF_HUB_OFFLINE
          & (Join-Path $fixture 'setup-resumable-7.27.ps1') -ModelWorkDir $work -HfDownloadWorkers 8
          if ($LASTEXITCODE -ne 0) { throw "fixture setup-resumable failed: $LASTEXITCODE" }
          if ($null -eq $beforeOffline) {
            if (Test-Path Env:HF_HUB_OFFLINE) { throw 'HF_HUB_OFFLINE leaked after setup-resumable returned' }
          } elseif ($env:HF_HUB_OFFLINE -ne $beforeOffline) {
            throw 'HF_HUB_OFFLINE was not restored to its previous value'
          }
      - name: Missing final artifact fails closed
        shell: powershell
        run: |
          $work = Join-Path $env:RUNNER_TEMP 'black-final-verifier-empty'
          New-Item -ItemType Directory -Force -Path $work | Out-Null
          & ./local-runtime/verify-model-pipeline-7.27.ps1 -ModelWorkDir $work | Out-Null
          if ($LASTEXITCODE -eq 0) { throw 'final verifier accepted an absent model/manifest' }
