name: validate-native-windows-boundary

on:
  pull_request:
    paths:
      - 'local-runtime/**'
      - '.github/workflows/validate-native-windows-boundary.yml'
  push:
    branches: [main]
    paths:
      - 'local-runtime/**'
      - '.github/workflows/validate-native-windows-boundary.yml'

jobs:
  native-boundary:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse native boundary scripts
        shell: powershell
        run: |
          $files = @(
            './local-runtime/assert-native-windows.ps1',
            './local-runtime/setup-resumable-7.27.ps1',
            './local-runtime/setup.ps1',
            './local-runtime/black-code-native.ps1'
          )
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [void][Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$tokens, [ref]$errors)
            if (@($errors).Count -gt 0) { throw "PowerShell parse failed: $file :: $($errors[0].Message)" }
          }
      - name: Native Windows host passes
        shell: powershell
        run: |
          Remove-Item Env:WSL_INTEROP -ErrorAction SilentlyContinue
          Remove-Item Env:WSL_DISTRO_NAME -ErrorAction SilentlyContinue
          ./local-runtime/assert-native-windows.ps1 -Quiet
      - name: WSL interop marker is rejected
        shell: powershell
        run: |
          $env:WSL_INTEROP = '/run/WSL/fixture_interop'
          $failed = $false
          try { ./local-runtime/assert-native-windows.ps1 -Quiet } catch { $failed = $true; Write-Host $_.Exception.Message }
          Remove-Item Env:WSL_INTEROP -ErrorAction SilentlyContinue
          if (-not $failed) { throw 'native boundary accepted WSL_INTEROP' }
      - name: WSL distro marker is rejected
        shell: powershell
        run: |
          $env:WSL_DISTRO_NAME = 'fixture-wsl'
          $failed = $false
          try { ./local-runtime/assert-native-windows.ps1 -Quiet } catch { $failed = $true; Write-Host $_.Exception.Message }
          Remove-Item Env:WSL_DISTRO_NAME -ErrorAction SilentlyContinue
          if (-not $failed) { throw 'native boundary accepted WSL_DISTRO_NAME' }
      - name: Native CMD entrypoint rejects WSL before setup
        shell: cmd
        run: |
          set WSL_INTEROP=fixture
          call local-runtime\BLACK-Code-Native.cmd
          if not errorlevel 1 exit /b 1
          exit /b 0
      - name: Setup installs guarded launcher
        shell: powershell
        run: |
          $setup = Get-Content -Raw ./local-runtime/setup.ps1
          foreach ($required in @('assert-native-windows.ps1','black-code-native.ps1','host_boundary="native-windows-no-docker-no-wsl"')) {
            if (-not $setup.Contains($required)) { throw "setup native-boundary contract missing: $required" }
          }
          if ($setup -notmatch '\$InstalledLauncher=Join-Path \$LauncherDir "black-code-native\.ps1"') {
            throw 'black-code shim is not routed through black-code-native.ps1'
          }
