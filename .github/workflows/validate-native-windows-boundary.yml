name: validate-native-windows-boundary

on:
  pull_request:
    paths:
      - 'local-runtime/**'
      - '.github/workflows/validate-native-windows-boundary.yml'
  push:
    branches: [main]
    paths:
      - 'local-runtime/**'
      - '.github/workflows/validate-native-windows-boundary.yml'

jobs:
  native-boundary:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse native boundary scripts
        shell: powershell
        run: |
          $files = @(
            './local-runtime/assert-native-windows.ps1',
            './local-runtime/setup-resumable-7.27.ps1',
            './local-runtime/setup.ps1',
            './local-runtime/black-code-native.ps1'
          )
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [void][Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$tokens, [ref]$errors)
            if (@($errors).Count -gt 0) { throw "PowerShell parse failed: $file :: $($errors[0].Message)" }
          }
      - name: Native Windows host passes
        shell: powershell
        run: |
          Remove-Item Env:WSL_INTEROP -ErrorAction SilentlyContinue
          Remove-Item Env:WSL_DISTRO_NAME -ErrorAction SilentlyContinue
          ./local-runtime/assert-native-windows.ps1 -Quiet
      - name: WSL interop marker is allowed
        shell: powershell
        run: |
          $env:WSL_INTEROP = '/run/WSL/fixture_interop'
          ./local-runtime/assert-native-windows.ps1 -Quiet
          Remove-Item Env:WSL_INTEROP -ErrorAction SilentlyContinue
      - name: WSL distro marker is allowed
        shell: powershell
        run: |
          $env:WSL_DISTRO_NAME = 'fixture-wsl'
          ./local-runtime/assert-native-windows.ps1 -Quiet
          Remove-Item Env:WSL_DISTRO_NAME -ErrorAction SilentlyContinue
      - name: Native CMD entrypoint does not pre-reject WSL markers
        shell: powershell
        run: |
          $cmd = Get-Content -Raw ./local-runtime/BLACK-Code-Native.cmd
          if ($cmd -match 'if defined WSL_INTEROP' -or $cmd -match 'if defined WSL_DISTRO_NAME') {
            throw 'native CMD entrypoint still rejects WSL control'
          }
      - name: Docker ancestry rejection contract is present
        shell: powershell
        run: |
          $guard = Get-Content -Raw ./local-runtime/assert-native-windows.ps1
          foreach ($required in @('Docker-controlled execution detected','Docker Desktop','com\.docker','\\docker\.exe')) {
            if (-not $guard.Contains($required)) { throw "Docker rejection contract missing: $required" }
          }
          if ($guard.Contains('intentionally refuses WSL-to-Windows bridge execution')) {
            throw 'WSL rejection contract is still present'
          }
      - name: Setup installs guarded launcher
        shell: powershell
        run: |
          $setup = Get-Content -Raw ./local-runtime/setup.ps1
          foreach ($required in @('assert-native-windows.ps1','black-code-native.ps1')) {
            if (-not $setup.Contains($required)) { throw "setup native-boundary contract missing: $required" }
          }
          if ($setup -notmatch '\$InstalledLauncher=Join-Path \$LauncherDir "black-code-native\.ps1"') {
            throw 'black-code shim is not routed through black-code-native.ps1'
          }
