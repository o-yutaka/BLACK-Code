name: validate-local-runtime

on:
  pull_request:
    paths:
      - 'local-runtime/**'
      - '.github/workflows/validate-local-runtime.yml'
  push:
    branches: [main]
    paths:
      - 'local-runtime/**'
      - '.github/workflows/validate-local-runtime.yml'

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify BLACK Code Execution Fabric
        shell: powershell
        run: ./local-runtime/verify.ps1
